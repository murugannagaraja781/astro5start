name: Deploy to DigitalOcean Base

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22                # change if your droplet uses another port
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }} # only if key is encrypted
          timeout: 30s
          script: |
            cd /var/www/astro5start
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            git reset --hard FETCH_HEAD
            npm ci --production --no-audit --no-fund --prefer-offline
            pm2 restart astro-app
