<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhonePe V1 - Web Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 40px; background: #0f172a; color: white; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        input { width: calc(100% - 20px); padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 6px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #059669; }
        .log { margin-top: 20px; font-family: monospace; font-size: 12px; color: #cbd5e1; text-align: left; background: #000; padding: 10px; border-radius: 6px; display: none; word-wrap: break-word;}
    </style>
</head>
<body>

<div class="card">
    <h2>PhonePe Direct Test</h2>
    <p>Test the PhonePe API V1 directly from your browser.</p>
    
    <input type="text" id="userId" placeholder="User ID" value="TestUser123">
    <input type="text" id="mobile" placeholder="Mobile Number" value="9999999999">
    <input type="number" id="amount" placeholder="Amount (in INR)" value="1">
    
    <button id="payBtn" onclick="testPayment()">Initiate Payment (₹1)</button>

    <div id="logBox" class="log"></div>
</div>

<script>
    async function testPayment() {
        const btn = document.getElementById('payBtn');
        const logBox = document.getElementById('logBox');
        btn.innerText = "Processing...";
        btn.disabled = true;
        logBox.style.display = "block";
        logBox.innerText = "Calling /api/payment/create...\n";

        const payload = {
            userId: document.getElementById('userId').value,
            userMobile: document.getElementById('mobile').value,
            amount: document.getElementById('amount').value
        };

        try {
            const response = await fetch('/api/payment/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            logBox.innerText += "\nResponse from server:\n" + JSON.stringify(data, null, 2);

            if (data.ok && data.paymentUrl) {
                logBox.innerText += "\n\nRedirecting to PhonePe in 2 seconds...";
                setTimeout(() => {
                    window.location.href = data.paymentUrl;
                }, 2000);
            } else {
                btn.innerText = "Try Again";
                btn.disabled = false;
            }
        } catch (error) {
            logBox.innerText += "\n\nError: " + error.message;
            btn.innerText = "Try Again";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
